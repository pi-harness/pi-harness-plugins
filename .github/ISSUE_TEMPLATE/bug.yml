name: Bug report
description: Report a reproducible problem
title: "bug: "
body:
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce, description: Include the smallest reproducible example}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior}
    validations: {required: true}
